<!DOCTYPE html>

<html>

<head>
    <title>ecommerce app</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="top-bar">

            <img src="images/endure_logo_horizontal-Photoroom.png" alt="endure-logo">

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="Search products...">
            </div>

            <div class="sign-in">
                <i class="fa-regular fa-circle-user"></i>
                <span>Sign In</span>
            </div>

            <div class="support">
                <i class="fa-regular fa-circle-question"></i>
                <span>Support</span>
            </div>

            <div class="wishlist">
                <div class="wishlist-icon-wrapper">
                    <i class="fa-regular fa-heart"></i>
                    <span class="wishlist-badge" data-count="0">0</span>
                </div>
                <span class="wishlist-text">Wishlist</span>
            </div>

            <div class="cart">
                <div class="cart-icon-wrapper">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" data-count="0">0</span>
                </div>
                <span class="cart-text">Cart</span>
            </div>

        </div>

        <div class="nav-bar">

            <a href=""> All Sports</a>
            <a href="">Men</a>
            <a href="">Women</a>
            <a href="">Kids</a>

        </div>

    </header>

    <section class="hero">

        <div class="hero-content">

            <div class="hero-text">
                <h1>ENDURE YOUR LIMITS</h1>
                <h3>Premium gear built for performance</h3>

            </div>

            <div class="hero-image">

            </div>

        </div>
        
    </section>


    <section class="shop-by-sport">

        <h2>Shop By Sport</h2>

        <div class="category-container">

            <div class="category-card football">

                <h3>Football</h3>

            </div>

            <div class="category-card cricket">

                <h3>Cricket</h3>

            </div>

            <div class="category-card gym">

                <h3>Gym & Yoga</h3>

            </div>

            <div class="category-card running">

                <h3>Running</h3>

            </div>

            <div class="category-card hiking">

                <h3>Trekking/Hiking</h3>

            </div>

             <div class="category-card swimming">

                <h3>Swimming</h3>

            </div>

             <div class="category-card badminton">

                <h3>Badminton</h3>

            </div>

            <div class="category-card accessories">

                <h3>Accessories</h3>

            </div>

        </div>

        
    </section>

    <section class="featured-products">

        <h2>Featured Products</h2>

        <div class="product-slider">

            <div class="product-card f1">

                <i class="fa-regular fa-heart"></i>
                <img src="images/accessories category background square.jpg" alt="">
                <div class="product-details">
                    <h4>Football Boots</h4>
                    <div class="rating">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <p>5  (1264)</p>
                    </div>
                    <p>₹2999</p>
                    <button>ADD</button>
                </div>

            </div>

        </div>

    </section>


    

    <script src="script.js"></script>
</body>
</html>
